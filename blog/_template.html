  <script>
    (function() {
      var stored = localStorage.getItem('theme');
      var dark = stored ? stored === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
<link rel="stylesheet" href="/site-shell/site-shell.css">
</head>
<body>

  <!-- site-header:start -->
<header class="mib-site-header">
  <div class="mib-site-header__inner">
    <a class="mib-site-logo" href="/">Make It Beta<sup>🧪</sup></a>
    <nav class="mib-site-nav" id="mib-site-nav" aria-label="Основная навигация">
      <a href="/#projects">Проекты</a>
      <a href="/model-tests/">Эксперименты</a>
      <a href="/blog/">Блог</a>
      <a href="/consulting/">Консалтинг</a>
      <a href="/#contact">Написать</a>
      <button class="mib-site-theme" type="button" aria-label="Переключить тему" title="Переключить тему"><span aria-hidden="true">🌙</span></button>
    </nav>
    <button class="mib-site-menu" type="button" aria-label="Открыть меню" aria-expanded="false" aria-controls="mib-site-nav"><span></span><span></span><span></span></button>
  </div>
</header>
<!-- site-header:end -->

  <div class="blog-wrap">

    <nav class="post-breadcrumb">
      <a href="/">Главная</a> <span>→</span>
      <a href="/blog/">Блог</a> <span>→</span>
      <span style="color:var(--ink);">$TITLE</span>
    </nav>

    <header class="post-header">
      $CATEGORY_TAG
      <h1>$TITLE</h1>
      <div class="post-meta">
        <time>$DATE_RU</time>
        <span class="post-meta__sep">·</span>
        <span>$READ_TIME чтения</span>
        $AUTHOR_META
      </div>
    </header>

    $ORIGINAL_BLOCK

    <article class="post-body">
      $CONTENT
    </article>

    <footer class="post-translator">
      $TRANSLATOR_BLOCK
    </footer>

  </div>

  <!-- site-footer:start -->
<footer class="mib-site-footer">
  <div class="mib-site-footer__inner">
    <a class="mib-site-logo" href="/">Make It Beta<sup>🧪</sup></a>
    <a href="/consulting/">Консалтинг</a>
    <a href="https://t.me/pavlenkodev" target="_blank" rel="noopener noreferrer">Телеграм-канал</a>
    <span>© 2026 makeitbeta.ru</span>
  </div>
</footer>
<!-- site-footer:end -->

  <script src="../../script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('pre code').forEach(function (el) {
        hljs.highlightElement(el);
      });
    });
  </script>
